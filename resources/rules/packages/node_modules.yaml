# Dependency-directory rules (builtin detection).
#
# Demonstrates the `parent_marker` + `exists` condition pair: a candidate
# (`node_modules` under a repo) only matches when its *parent* directory holds
# `package.json`. Rules here classify, they never delete (INV-009).
rules:
  - id: builtin-detection/node-project-node-modules
    description: npm project dependency tree, re-downloadable via npm ci
    product: npm
    category: dependency
    risk: regenerable-download
    source: builtin-detection
    match:
      glob: "%USERPROFILE%/repos/*/node_modules"
      parent_marker: package.json
      exists: true
