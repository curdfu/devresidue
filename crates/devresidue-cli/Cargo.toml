[package]
name = "devresidue-cli"
description = "DevResidue command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "devresidue"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
devresidue-ai = { path = "../devresidue-ai" }
devresidue-core = { path = "../devresidue-core" }
devresidue-platform-windows = { path = "../devresidue-platform-windows" }
devresidue-providers = { path = "../devresidue-providers" }
serde_json = "1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
